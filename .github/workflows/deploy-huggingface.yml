name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upload app to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN secret first (Settings > Secrets and variables > Actions)"; exit 1; fi
          pip install -q huggingface_hub
          python - <<'PY'
          import os, shutil
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo_id = f"{user}/whatsapp-group-manager"
          api.create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True)

          # Build the Space folder: same code + a README with the Space settings on top
          out = "/tmp/space"
          shutil.copytree(".", out, ignore=shutil.ignore_patterns(".git", ".github", "node_modules", "*.xlsx"))
          header = "---\ntitle: WhatsApp Group Manager\nemoji: 📲\ncolorFrom: green\ncolorTo: blue\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n"
          with open("README.md", encoding="utf-8") as f:
              body = f.read()
          with open(f"{out}/README.md", "w", encoding="utf-8") as f:
              f.write(header + body)

          api.upload_folder(folder_path=out, repo_id=repo_id, repo_type="space",
                            commit_message="Deploy from GitHub", delete_patterns=["*"])
          url = f"https://{user.lower().replace('_','-').replace('.','-')}-whatsapp-group-manager.hf.space"
          print("App URL:", url)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## ✅ Deployed\nApp link: {url}\n")
          PY
